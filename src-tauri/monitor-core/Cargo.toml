[package]
name = "monitor-core"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
base64 = "0.22"
md-5 = "0.10"

[target.'cfg(windows)'.dependencies]
image = { version = "0.25", default-features = false, features = ["jpeg"] }
winreg = "0.52"
windows-sys = { version = "0.61", features = [
  "Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Security",
  "Win32_System_EventLog", "Win32_System_StationsAndDesktops",
  "Win32_System_Threading", "Win32_System_SystemInformation",
  "Win32_System_RemoteDesktop", "Win32_Storage_FileSystem",
  "Win32_System_WindowsProgramming",
  "Win32_System_Registry",
  "Win32_System_IO", "Win32_System_Ioctl",
  "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell"
] }

[dev-dependencies]
tempfile = "3"
