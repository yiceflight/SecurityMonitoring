name: Compatibility Check

on:
  push:
    branches:
      - 'codex/**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  modern-and-core:
    name: Modern and core checks
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false
          cache: true

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            src-tauri -> target
            src-tauri/monitor-core -> target

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Run frontend tests
        run: pnpm test

      - name: Run monitor core tests
        run: cargo test --locked --manifest-path src-tauri/monitor-core/Cargo.toml

      - name: Typecheck and build frontend
        run: pnpm build

      - name: Check Tauri application
        run: cargo check --locked --manifest-path src-tauri/Cargo.toml

      - name: Build modern NSIS bundle
        run: pnpm tauri build --bundles nsis --ci --verbose

      - name: Upload modern bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: modern-windows-bundle
          if-no-files-found: warn
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/security-monitoring.exe

  legacy-and-unified-installer:
    name: Legacy x86 and unified installer
    runs-on: windows-2022
    timeout-minutes: 90
    env:
      SECURITY_MONITORING_CMAKE_TOOLSET: v141_xp
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Verify XP toolset is installed
        id: xp-toolset
        shell: pwsh
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          if (-not (Test-Path $vswhere)) {
            throw 'vswhere.exe was not found on the hosted runner.'
          }
          $installations = & $vswhere -products * -requires Microsoft.VisualStudio.Component.VC.v141 -format value -property installationPath
          if (-not $installations) {
            throw 'Visual Studio v141 is not installed; the XP-compatible Legacy build cannot be verified on this runner.'
          }
          Write-Host "v141 installation: $installations"

      - name: Explain legacy build gate
        if: failure()
        shell: pwsh
        run: |
          @'
          ## Legacy build blocked by runner toolchain

          This job requires the Visual Studio v141 XP toolset (`v141_xp`). The GitHub-hosted Windows 2022 image does not provide it, so the XP-compatible C++ build was not attempted. Run this job on a self-hosted Windows machine with the v141 XP component installed.
          '@ | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

      - name: Install NSIS
        shell: pwsh
        run: choco install nsis --yes --no-progress

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false
          cache: true

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build modern client
        run: pnpm desktop:build

      - name: Build Legacy client and unified installer
        shell: pwsh
        run: .\scripts\build-unified-installer.ps1

      - name: Upload Legacy and unified installer artifacts
        if: always() && steps.xp-toolset.conclusion == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: legacy-unified-installer
          if-no-files-found: warn
          path: |
            legacy-win32/build/*.exe
            legacy-win32/build/Release/*.exe
